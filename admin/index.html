<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Maison Noir · Panel</title>
<meta name="theme-color" content="#0b0a08">
<link rel="icon" href="../assets/icono.png">
<link rel="apple-touch-icon" href="../assets/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  --noir:#0b0a08; --carbon:#15130f; --carbon2:#1c1914; --line:#2a251c;
  --gold:#d4ad5a; --gold-soft:#a8884a; --ivory:#efe8da; --mute:#8d8576; --off:#5a554c;
  --ok:#7fb27f; --warn:#e0a24a; --bad:#d9705f;
  --display:"Italiana","Didot",Georgia,serif;
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --nav:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--noir)}
body{margin:0;background:var(--noir);color:var(--ivory);font-family:var(--body);font-weight:300;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;flex:none}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main{max-width:640px;margin:0 auto;padding-block:12px calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px))}

/* Barra superior */
.bar{position:sticky;top:0;z-index:20;background:rgba(11,10,8,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;height:54px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.12em;color:var(--gold);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:var(--body);font-size:10px;letter-spacing:.2em;color:var(--mute);margin-left:6px;text-transform:uppercase}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--carbon);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:var(--ivory)}
.icon-btn[aria-pressed="true"]{color:var(--gold);border-color:var(--gold-soft)}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,15,12,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav)}
.nav button{appearance:none;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.nav button[aria-current="page"]{color:var(--gold)}

/* Comunes */
h2{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.03em;margin:8px 0 12px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.search{width:100%;background:var(--carbon);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px}
.btn{appearance:none;border:1px solid var(--line);background:var(--carbon);border-radius:12px;padding:11px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;white-space:nowrap}
.btn.gold{background:var(--gold);color:var(--noir);border-color:var(--gold);font-weight:500}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#4a2a24;background:transparent}
.btn.block{width:100%;padding:15px;font-size:16px}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;flex:none;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:7px 14px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--noir);border-color:var(--gold);font-weight:500}
.muted{color:var(--mute)}
.small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.thumb{width:52px;height:64px;flex:none;display:flex;align-items:flex-end;justify-content:center}
.thumb .frasco{height:100%;width:auto}
.thumb .foto{max-height:100%;max-width:100%;object-fit:contain}
.empty{padding:40px 0;text-align:center;color:var(--mute)}

/* Ojito: oculta todo lo marcado como secreto */
body.oculto .secreto{color:transparent!important;text-shadow:0 0 0 transparent;position:relative}
body.oculto .secreto::after{content:"••••••";position:absolute;left:0;top:0;color:var(--off);letter-spacing:.1em}
body.oculto .secreto.right::after{left:auto;right:0}

/* Login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:380px;margin:0 auto;padding-block:40px}
.login img{width:100%;border-radius:12px}
.login label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.field{display:flex;flex-direction:column;gap:6px}
.input{background:var(--carbon);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;width:100%}
textarea.input{min-height:80px;resize:vertical}
.err{color:var(--bad);font-size:13px;min-height:18px}

/* Inventario */
.inv-head{display:flex;gap:8px;margin-bottom:10px}
.inv{display:flex;flex-direction:column}
.inv-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.inv-item.out .thumb,.inv-item.out .inv-name{opacity:.45;filter:grayscale(1)}
.inv-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;appearance:none;border:0;background:none;padding:0}
.inv-name{font-size:16px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-name small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);margin-right:6px}
.inv-prices{display:flex;gap:12px;font-size:13px;flex-wrap:wrap}
.inv-prices b{font-weight:400;color:var(--gold)}
.tag-out{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bad);border:1px solid #4a2a24;border-radius:4px;padding:1px 6px}
.switch{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;border:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ivory);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* Ventas */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.card{position:relative;background:var(--carbon);border:1px solid var(--line);border-radius:14px;padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;appearance:none;color:inherit}
.card .ph{height:96px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.card .ph .frasco{height:100%;width:auto}
.card .ph .foto{max-height:100%;max-width:100%;object-fit:contain}
.card .nm{font-size:13px;line-height:1.15;font-weight:400;min-height:30px;display:flex;align-items:center}
.card .cs{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft)}
.card .pr{font-size:12px;color:var(--gold)}
.card.out .ph,.card.out .nm{opacity:.45;filter:grayscale(1)}
.ask{position:absolute;top:6px;right:6px;appearance:none;border:1px solid var(--line);background:var(--noir);color:var(--mute);border-radius:999px;height:28px;min-width:28px;padding:0 7px;display:flex;align-items:center;gap:3px;font-size:11px}
.ask svg{width:15px;height:15px}
.ask.has{color:var(--gold);border-color:var(--gold-soft)}

/* Hoja inferior */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--carbon);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.sheet-head{display:flex;gap:12px;align-items:center}
.sheet-head .thumb{width:60px;height:76px}
.sheet-title{font-family:var(--display);font-size:24px;line-height:1.1}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.qty{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.opt{appearance:none;border:1px solid var(--line);background:var(--noir);border-radius:12px;padding:12px 4px;font-size:17px;font-weight:400;text-align:center}
.opt[aria-pressed="true"]{border-color:var(--gold);background:#2a2214;color:var(--gold)}
.opt.wide{font-size:14px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;align-items:center}
.opt.wide small{font-size:12px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.warn{color:var(--warn);font-size:13px}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.total strong{font-size:22px;font-weight:400;color:var(--gold)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.nrow{display:grid;grid-template-columns:1fr 130px 36px;gap:6px;margin-bottom:6px}
.nrow select{background:var(--noir);border:1px solid var(--line);border-radius:10px;padding:8px}
.x{appearance:none;border:1px solid var(--line);background:none;border-radius:10px;color:var(--mute)}
.photo-edit{display:flex;gap:14px;align-items:center}
.photo-edit .thumb{width:80px;height:100px}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Resumen */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 20px}
.tile{background:var(--carbon);border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tile b{font-size:18px;font-weight:400;color:var(--ivory);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.g b{color:var(--gold)}
.sec{margin-bottom:24px}
.sec h3{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft);font-weight:400;margin:0 0 10px}
.rank{display:flex;flex-direction:column;gap:10px}
.rk{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center}
.rk .pos{color:var(--off);font-size:13px}
.rk .nm{min-width:0;display:flex;flex-direction:column;gap:4px}
.rk .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.rk .barra{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.rk .barra i{display:block;height:100%;background:var(--gold-soft);border-radius:4px}
.rk .v{font-size:14px;text-align:right}
.seller{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.sale{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.sale .grow small{display:block;color:var(--mute);font-size:12px}
.del{appearance:none;border:1px solid var(--line);background:none;color:var(--mute);border-radius:10px;padding:6px 10px;font-size:12px}
.del.sure{color:var(--bad);border-color:#4a2a24}

/* Aviso */
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ivory);color:var(--noir);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:400;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="v-login" class="pad" hidden>
  <form class="login" id="f-login">
    <img src="../assets/logo.jpg" alt="Maison Noir">
    <p class="muted small" style="text-align:center;letter-spacing:.2em;text-transform:uppercase">Panel del equipo</p>
    <div class="field"><label for="l-email">Correo</label><input class="input" id="l-email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="l-pass">Contraseña</label><input class="input" id="l-pass" type="password" autocomplete="current-password" required></div>
    <p class="err" id="l-err"></p>
    <button class="btn gold block" id="l-btn" type="submit">Entrar</button>
  </form>
</section>

<!-- SIN CONFIGURAR -->
<section id="v-config" class="pad" hidden>
  <div class="login">
    <img src="../assets/logo.jpg" alt="Maison Noir">
    <p>Falta conectar Supabase. Abre el archivo <b>config.js</b> en GitHub y pega el Project URL y la anon key (paso 6 de la guía LEEME.md).</p>
  </div>
</section>

<!-- APP -->
<div id="v-app" hidden>
  <header class="bar pad">
    <div class="bar-in">
      <div class="brand">MAISON NOIR<small id="who"></small></div>
      <button class="icon-btn" id="b-eye" aria-pressed="false" aria-label="Ocultar costos y ganancias" title="Ocultar costos y ganancias">
        <svg class="i" id="eye-ico" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="icon-btn" id="b-out" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg class="i" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg>
      </button>
    </div>
  </header>

  <main class="main pad">
    <!-- INVENTARIO -->
    <section id="t-inv">
      <h2>Inventario</h2>
      <div class="inv-head">
        <input class="search grow" id="inv-q" type="search" placeholder="Buscar perfume o casa">
        <button class="btn gold" id="b-new" aria-label="Agregar perfume"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nuevo</button>
      </div>
      <div class="row" style="margin-bottom:6px">
        <div class="chips grow" id="inv-f">
          <button class="chip" data-f="" aria-pressed="true">Todos</button>
          <button class="chip" data-f="masculino" aria-pressed="false">Hombre</button>
          <button class="chip" data-f="unisex" aria-pressed="false">Unisex</button>
          <button class="chip" data-f="femenino" aria-pressed="false">Mujer</button>
          <button class="chip" data-f="out" aria-pressed="false">Agotados</button>
        </div>
        <button class="btn ghost" id="b-set" aria-label="Ajustes"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
      <div class="inv" id="inv"></div>
    </section>

    <!-- VENTAS -->
    <section id="t-ven" hidden>
      <h2>Registrar venta</h2>
      <input class="search" id="ven-q" type="search" placeholder="Buscar perfume">
      <p class="muted small" style="margin:8px 0 0">Toca la foto para vender. Toca <svg class="i" style="width:14px;height:14px;vertical-align:-2px" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg> cuando te pregunten por uno.</p>
      <div class="grid" id="ven"></div>
    </section>

    <!-- RESUMEN -->
    <section id="t-res" hidden>
      <h2>Resumen</h2>
      <div class="chips" id="res-p">
        <button class="chip" data-p="hoy" aria-pressed="true">Hoy</button>
        <button class="chip" data-p="semana" aria-pressed="false">Esta semana</button>
        <button class="chip" data-p="mes" aria-pressed="false">Este mes</button>
        <button class="chip" data-p="todo" aria-pressed="false">Todo</button>
      </div>
      <div id="res"></div>
    </section>
  </main>

  <nav class="nav" aria-label="Secciones">
    <div class="nav-in">
      <button data-t="t-inv" aria-current="page"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Inventario</button>
      <button data-t="t-ven"><svg class="i" viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Ventas</button>
      <button data-t="t-res"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</button>
    </div>
  </nav>
</div>

<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script src="../assets/comun.js"></script>
<script>
const UI = MaisonUI, db = UI.cliente();
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const S = { perfumes: [], costos: {}, ventas: [], preguntas: [], ajustes: {}, invF: '', invQ: '', venQ: '', periodo: 'hoy' };
const EYE_OPEN = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
const EYE_OFF = '<path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
const store = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
const secreto = (txt, right) => `<span class="secreto${right ? ' right' : ''}">${txt}</span>`;
const vendedores = () => (S.ajustes.vendedores || 'Juan Pablo,Fonegra,Juliana').split(',').map(s => s.trim()).filter(Boolean);
const slugify = s => s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const img = p => UI.imagen(p, '../');

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600);
}
function fallo(e) { console.error(e); toast('No se pudo guardar. Revisa la conexión e inténtalo de nuevo.', true); }

/* ---------- Ojito ---------- */
function setEye(on) {
  document.body.classList.toggle('oculto', on);
  $('#b-eye').setAttribute('aria-pressed', on);
  $('#eye-ico').innerHTML = on ? EYE_OFF : EYE_OPEN;
  store.set('maison-ojo', on ? '1' : '0');
}
$('#b-eye').onclick = () => setEye(!document.body.classList.contains('oculto'));

/* ---------- Sesión ---------- */
async function iniciar() {
  if (!db) { $('#v-config').hidden = false; return; }
  setEye(store.get('maison-ojo') === '1');
  const { data } = await db.auth.getSession();
  if (data.session) entrar(data.session); else $('#v-login').hidden = false;
}
$('#f-login').onsubmit = async e => {
  e.preventDefault();
  $('#l-err').textContent = ''; $('#l-btn').disabled = true;
  const { data, error } = await db.auth.signInWithPassword({ email: $('#l-email').value.trim(), password: $('#l-pass').value });
  $('#l-btn').disabled = false;
  if (error) { $('#l-err').textContent = 'Correo o contraseña incorrectos.'; return; }
  entrar(data.session);
};
$('#b-out').onclick = async () => { await db.auth.signOut(); location.reload(); };

async function entrar(session) {
  $('#v-login').hidden = true; $('#v-app').hidden = false;
  $('#who').textContent = (session.user.email || '').split('@')[0];
  await cargarTodo();
}

async function cargarTodo() {
  const [p, c, v, q, a] = await Promise.all([
    db.from('perfumes').select('*').order('orden'),
    db.from('costos').select('*'),
    db.from('ventas').select('*').order('fecha', { ascending: false }).limit(5000),
    db.from('preguntas').select('*').order('fecha', { ascending: false }).limit(10000),
    db.from('ajustes').select('*')
  ]);
  if (p.error) { toast('No se pudo cargar el inventario.', true); console.error(p.error); return; }
  S.perfumes = p.data;
  S.costos = Object.fromEntries((c.data || []).map(x => [x.perfume_id, x]));
  S.ventas = v.data || []; S.preguntas = q.data || [];
  S.ajustes = Object.fromEntries((a.data || []).map(x => [x.clave, x.valor]));
  pintarInv(); pintarVen(); pintarRes();
}

/* ---------- Inventario ---------- */
function pintarInv() {
  const q = S.invQ.toLowerCase();
  const items = S.perfumes.filter(p =>
    (!S.invF || (S.invF === 'out' ? !p.disponible : p.genero === S.invF)) &&
    (!q || (p.nombre + ' ' + p.casa).toLowerCase().includes(q)));
  $('#inv').innerHTML = items.map(p => {
    const c = S.costos[p.id] || {};
    return `<div class="inv-item${p.disponible ? '' : ' out'}">
      <div class="thumb">${img(p)}</div>
      <button class="inv-main" data-edit="${p.id}">
        <span class="inv-name"><small>${UI.esc(p.casa)}</small>${UI.esc(p.nombre)}</span>
        <span class="inv-prices num"><span>Venta <b>${UI.pesos(p.precio)}</b></span><span class="muted">Entra ${secreto(UI.pesos(c.costo || 0))}</span>${p.disponible ? '' : '<span class="tag-out">Agotado</span>'}</span>
      </button>
      <button class="switch" role="switch" aria-checked="${p.disponible}" aria-label="Disponible ${UI.esc(p.nombre)}" data-av="${p.id}"></button>
    </div>`;
  }).join('') || '<p class="empty">No hay perfumes con ese filtro.</p>';
}
$('#inv-q').oninput = e => { S.invQ = e.target.value; pintarInv(); };
$$('#inv-f .chip').forEach(b => b.onclick = () => { S.invF = b.dataset.f; $$('#inv-f .chip').forEach(x => x.setAttribute('aria-pressed', x === b)); pintarInv(); });
$('#inv').onclick = async e => {
  const sw = e.target.closest('[data-av]');
  if (sw) {
    const p = S.perfumes.find(x => x.id == sw.dataset.av); const nuevo = !p.disponible;
    const { error } = await db.from('perfumes').update({ disponible: nuevo }).eq('id', p.id);
    if (error) return fallo(error);
    p.disponible = nuevo; pintarInv(); pintarVen();
    toast(nuevo ? p.nombre + ' disponible otra vez' : p.nombre + ' marcado como agotado');
    return;
  }
  const ed = e.target.closest('[data-edit]');
  if (ed) editar(S.perfumes.find(x => x.id == ed.dataset.edit));
};
$('#b-new').onclick = () => editar(null);

/* ---------- Hoja inferior ---------- */
function abrirHoja(html, onReady) {
  const root = $('#sheet-root');
  root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  document.body.style.overflow = 'hidden';
  $('#scrim').onclick = e => { if (e.target.id === 'scrim') cerrarHoja(); };
  onReady && onReady($('.sheet', root));
}
function cerrarHoja() { $('#sheet-root').innerHTML = ''; document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarHoja(); });

/* ---------- Editar / nuevo perfume ---------- */
function editar(p) {
  const nuevo = !p;
  p = p || { nombre: '', casa: '', genero: 'masculino', tipo: 'Árabe', precio: 0, disponible: true, momento: [], notas: [], descripcion: '', foto: null };
  const c = (p.id && S.costos[p.id]) || { costo: 0, minimo: 0 };
  const sel = (arr, val) => arr.map(([v, t]) => `<button type="button" class="opt" data-v="${v}" aria-pressed="${val === v}">${t}</button>`).join('');
  const famOpts = k => Object.entries(UI.FAMILIAS).map(([v, t]) => `<option value="${v}"${v === k ? ' selected' : ''}>${t}</option>`).join('');
  const notaRow = n => `<div class="nrow"><input class="input" placeholder="Ej: Vainilla" value="${UI.esc(n.t || '')}"><select>${famOpts(n.i || 'dulce')}</select><button type="button" class="x" aria-label="Quitar nota">✕</button></div>`;
  let fotoNueva = null;

  abrirHoja(`
    <div class="sheet-title">${nuevo ? 'Nuevo perfume' : 'Editar perfume'}</div>
    <div class="photo-edit">
      <div class="thumb" id="e-ph">${img(p.id ? p : { ...p, id: 1 })}</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label class="btn file"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Cambiar foto<input type="file" accept="image/*" id="e-file"></label>
        <span class="muted small">Mejor sin fondo (PNG)</span>
      </div>
    </div>
    <div class="fgrid">
      <div class="field full"><span class="lbl">Nombre</span><input class="input" id="e-nombre" value="${UI.esc(p.nombre)}"></div>
      <div class="field full"><span class="lbl">Casa</span><input class="input" id="e-casa" value="${UI.esc(p.casa)}" list="casas"></div>
    </div>
    <datalist id="casas">${[...new Set(S.perfumes.map(x => x.casa))].map(x => `<option value="${UI.esc(x)}">`).join('')}</datalist>
    <div><div class="lbl">Género</div><div class="three" id="e-gen">${sel([['masculino', 'Hombre'], ['unisex', 'Unisex'], ['femenino', 'Mujer']], p.genero)}</div></div>
    <div><div class="lbl">Tipo</div><div class="three" id="e-tipo">${sel([['Árabe', 'Árabe'], ['Diseñador', 'Diseñador'], ['Nicho', 'Nicho']], p.tipo)}</div></div>
    <div class="fgrid">
      <div class="field"><span class="lbl">Precio venta</span><input class="input num" id="e-precio" inputmode="numeric" value="${p.precio || ''}"></div>
      <div class="field"><span class="lbl">Cómo entra</span><input class="input num secreto-input" id="e-costo" inputmode="numeric" value="${c.costo || ''}"></div>
      <div class="field"><span class="lbl">Mínimo</span><input class="input num secreto-input" id="e-min" inputmode="numeric" value="${c.minimo || ''}"></div>
      <div class="field"><span class="lbl">Ganancia</span><div class="input num" id="e-gan" style="border-style:dashed"></div></div>
    </div>
    <div class="row"><span class="grow">Disponible</span><button type="button" class="switch" role="switch" id="e-disp" aria-checked="${p.disponible}" aria-label="Disponible"></button></div>
    <div><div class="lbl">Cuándo usarlo</div><div class="chips" id="e-mom" style="flex-wrap:wrap">${Object.entries(UI.MOMENTO).map(([v, t]) => `<button type="button" class="chip" data-v="${v}" aria-pressed="${(p.momento || []).includes(v)}">${t}</button>`).join('')}</div></div>
    <div><div class="lbl">Notas (aroma)</div><div id="e-notas">${(p.notas || []).map(notaRow).join('')}</div><button type="button" class="btn ghost" id="e-addn">+ Agregar nota</button></div>
    <div class="field"><span class="lbl">Recomendación corta</span><textarea class="input" id="e-desc" maxlength="90" placeholder="Ej: Dulce y elegante. Para la noche.">${UI.esc(p.descripcion)}</textarea></div>
    <button class="btn gold block" id="e-save">${nuevo ? 'Agregar al catálogo' : 'Guardar cambios'}</button>
    ${nuevo ? '' : '<button class="btn danger block" id="e-del">Eliminar del catálogo</button>'}
  `, sh => {
    const pick = id => $$('#' + id + ' .opt', sh).forEach(b => b.onclick = () => $$('#' + id + ' .opt', sh).forEach(x => x.setAttribute('aria-pressed', x === b)));
    pick('e-gen'); pick('e-tipo');
    $$('#e-mom .chip', sh).forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));
    $('#e-disp', sh).onclick = e => e.currentTarget.setAttribute('aria-checked', e.currentTarget.getAttribute('aria-checked') !== 'true');
    const n = id => Number(($('#' + id, sh).value || '').replace(/\D/g, '')) || 0;
    const gan = () => { $('#e-gan', sh).innerHTML = secreto(UI.pesos(n('e-precio') - n('e-costo'))); };
    ['e-precio', 'e-costo'].forEach(id => $('#' + id, sh).oninput = gan); gan();
    if (document.body.classList.contains('oculto')) ['e-costo', 'e-min'].forEach(id => $('#' + id, sh).type = 'password');
    $('#e-addn', sh).onclick = () => $('#e-notas', sh).insertAdjacentHTML('beforeend', notaRow({}));
    $('#e-notas', sh).onclick = e => { if (e.target.closest('.x')) e.target.closest('.nrow').remove(); };
    $('#e-file', sh).onchange = e => {
      fotoNueva = e.target.files[0];
      if (fotoNueva) $('#e-ph', sh).innerHTML = `<img class="foto" src="${URL.createObjectURL(fotoNueva)}" alt="">`;
    };
    $('#e-save', sh).onclick = async () => {
      const nombre = $('#e-nombre', sh).value.trim(), casa = $('#e-casa', sh).value.trim();
      if (!nombre || !casa) return toast('Falta el nombre o la casa.', true);
      const btn = $('#e-save', sh); btn.disabled = true; btn.textContent = 'Guardando…';
      try {
        const datos = {
          nombre, casa,
          genero: $('#e-gen .opt[aria-pressed="true"]', sh).dataset.v,
          tipo: $('#e-tipo .opt[aria-pressed="true"]', sh).dataset.v,
          precio: n('e-precio'),
          disponible: $('#e-disp', sh).getAttribute('aria-checked') === 'true',
          momento: $$('#e-mom .chip[aria-pressed="true"]', sh).map(b => b.dataset.v),
          notas: $$('#e-notas .nrow', sh).map(r => ({ t: $('input', r).value.trim(), i: $('select', r).value })).filter(x => x.t),
          descripcion: $('#e-desc', sh).value.trim()
        };
        let slug = p.slug;
        if (nuevo) {
          slug = slugify(casa + '-' + nombre);
          if (S.perfumes.some(x => x.slug === slug)) slug += '-' + Date.now().toString(36);
          datos.slug = slug; datos.orden = S.perfumes.length;
        }
        if (fotoNueva) datos.foto = await subirFoto(fotoNueva, slug);
        let id = p.id;
        if (nuevo) {
          const r = await db.from('perfumes').insert(datos).select().single(); if (r.error) throw r.error; id = r.data.id;
        } else {
          const r = await db.from('perfumes').update(datos).eq('id', id); if (r.error) throw r.error;
        }
        const rc = await db.from('costos').upsert({ perfume_id: id, costo: n('e-costo'), minimo: n('e-min') }); if (rc.error) throw rc.error;
        cerrarHoja(); await cargarTodo(); toast(nuevo ? 'Perfume agregado' : 'Cambios guardados');
      } catch (e) { btn.disabled = false; btn.textContent = 'Guardar cambios'; fallo(e); }
    };
    const del = $('#e-del', sh);
    if (del) del.onclick = async () => {
      if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = 'Toca otra vez para eliminar'; return; }
      const { error } = await db.from('perfumes').delete().eq('id', p.id);
      if (error) return fallo(error);
      cerrarHoja(); await cargarTodo(); toast('Perfume eliminado');
    };
  });
}

async function subirFoto(file, nombre) {
  const ext = (file.name.split('.').pop() || 'png').toLowerCase();
  const ruta = nombre + '-' + Date.now() + '.' + ext;
  const { error } = await db.storage.from('fotos').upload(ruta, file, { upsert: true, contentType: file.type });
  if (error) throw error;
  return db.storage.from('fotos').getPublicUrl(ruta).data.publicUrl;
}

/* ---------- Ventas ---------- */
const inicioHoy = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const preguntasHoy = id => S.preguntas.filter(q => q.perfume_id === id && new Date(q.fecha) >= inicioHoy()).length;

function pintarVen() {
  const q = S.venQ.toLowerCase();
  const items = S.perfumes.filter(p => !q || (p.nombre + ' ' + p.casa).toLowerCase().includes(q));
  $('#ven').innerHTML = items.map(p => {
    const n = preguntasHoy(p.id);
    return `<div class="card${p.disponible ? '' : ' out'}" role="button" tabindex="0" data-sell="${p.id}" aria-label="Vender ${UI.esc(p.nombre)}">
      <button class="ask${n ? ' has' : ''}" data-ask="${p.id}" aria-label="Sumar pregunta por ${UI.esc(p.nombre)}"><svg class="i" viewBox="0 0 24 24">${EYE_OPEN}</svg>${n || ''}</button>
      <div class="ph">${img(p)}</div>
      <span class="cs">${UI.esc(p.casa)}</span>
      <span class="nm">${UI.esc(p.nombre)}</span>
      <span class="pr num">${UI.pesos(p.precio)}</span>
    </div>`;
  }).join('') || '<p class="empty" style="grid-column:1/-1">No encontré ese perfume.</p>';
}
$('#ven-q').oninput = e => { S.venQ = e.target.value; pintarVen(); };
$('#ven').onclick = async e => {
  const ask = e.target.closest('[data-ask]');
  if (ask) {
    e.stopPropagation();
    const id = Number(ask.dataset.ask);
    const { data, error } = await db.from('preguntas').insert({ perfume_id: id, origen: 'manual' }).select().single();
    if (error) return fallo(error);
    S.preguntas.unshift(data); pintarVen();
    const p = S.perfumes.find(x => x.id === id);
    toast('Pregunta sumada · ' + p.nombre + ' (' + preguntasHoy(id) + ' hoy)');
    return;
  }
  const card = e.target.closest('[data-sell]');
  if (card) vender(S.perfumes.find(x => x.id == card.dataset.sell));
};
$('#ven').onkeydown = e => { if (e.key === 'Enter' && e.target.dataset.sell) vender(S.perfumes.find(x => x.id == e.target.dataset.sell)); };

function vender(p) {
  const c = S.costos[p.id] || { costo: 0, minimo: 0 };
  const vs = vendedores();
  let cant = 1, precio = p.precio, otro = false, quien = store.get('maison-vendedor');
  if (!vs.includes(quien)) quien = vs[0];

  abrirHoja(`
    <div class="sheet-head"><div class="thumb">${img(p)}</div><div><div class="muted small" style="letter-spacing:.16em;text-transform:uppercase">${UI.esc(p.casa)}</div><div class="sheet-title">${UI.esc(p.nombre)}</div></div></div>
    <div><div class="lbl">¿Cuántos vendiste?</div>
      <div class="qty" id="s-qty">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="opt" data-q="${n}" aria-pressed="${n === 1}">${n}</button>`).join('')}<button type="button" class="opt" data-q="mas" aria-pressed="false" style="font-size:14px">Más</button></div>
      <input class="input num" id="s-qmas" type="number" min="6" inputmode="numeric" placeholder="¿Cuántos?" style="margin-top:8px" hidden>
    </div>
    <div><div class="lbl">¿En qué valor?</div>
      <div class="two" id="s-pr">
        <button type="button" class="opt wide" data-p="cat" aria-pressed="true">Catálogo<small class="num">${UI.pesos(p.precio)}</small></button>
        <button type="button" class="opt wide" data-p="otro" aria-pressed="false">Otro valor<small>escribirlo</small></button>
      </div>
      <input class="input num" id="s-otro" inputmode="numeric" placeholder="Valor por unidad" style="margin-top:8px" hidden>
      <p class="warn" id="s-warn" hidden></p>
      <p class="muted small" style="margin:6px 0 0">Mínimo: ${secreto(UI.pesos(c.minimo || 0))}</p>
    </div>
    <div><div class="lbl">¿Quién vendió?</div><div class="three" id="s-who">${vs.map(v => `<button type="button" class="opt" style="font-size:14px" data-w="${UI.esc(v)}" aria-pressed="${v === quien}">${UI.esc(v)}</button>`).join('')}</div></div>
    <div class="total"><div><div class="muted small">Total</div><strong class="num" id="s-tot"></strong></div><div style="text-align:right"><div class="muted small">Ganancia</div><span class="num" id="s-gan"></span></div></div>
    <button class="btn gold block" id="s-save">Guardar venta</button>
  `, sh => {
    const calc = () => {
      if (otro) precio = Number(($('#s-otro', sh).value || '').replace(/\D/g, '')) || 0;
      else precio = p.precio;
      $('#s-tot', sh).textContent = UI.pesos(precio * cant);
      $('#s-gan', sh).innerHTML = secreto(UI.pesos((precio - (c.costo || 0)) * cant), true);
      const w = $('#s-warn', sh);
      w.hidden = !(otro && precio > 0 && c.minimo && precio < c.minimo);
      if (!w.hidden) w.innerHTML = 'Está por debajo del mínimo (' + secreto(UI.pesos(c.minimo)) + ').';
    };
    $$('#s-qty .opt', sh).forEach(b => b.onclick = () => {
      $$('#s-qty .opt', sh).forEach(x => x.setAttribute('aria-pressed', x === b));
      const mas = b.dataset.q === 'mas'; $('#s-qmas', sh).hidden = !mas;
      if (mas) { $('#s-qmas', sh).focus(); cant = Number($('#s-qmas', sh).value) || 6; } else cant = Number(b.dataset.q);
      calc();
    });
    $('#s-qmas', sh).oninput = e => { cant = Math.max(1, Number(e.target.value) || 1); calc(); };
    $$('#s-pr .opt', sh).forEach(b => b.onclick = () => {
      $$('#s-pr .opt', sh).forEach(x => x.setAttribute('aria-pressed', x === b));
      otro = b.dataset.p === 'otro'; $('#s-otro', sh).hidden = !otro; if (otro) $('#s-otro', sh).focus(); calc();
    });
    $('#s-otro', sh).oninput = calc;
    $$('#s-who .opt', sh).forEach(b => b.onclick = () => { quien = b.dataset.w; $$('#s-who .opt', sh).forEach(x => x.setAttribute('aria-pressed', x === b)); });
    calc();
    $('#s-save', sh).onclick = async () => {
      if (!precio) return toast('Escribe el valor de venta.', true);
      if (!quien) return toast('Escoge quién vendió.', true);
      const btn = $('#s-save', sh); btn.disabled = true; btn.textContent = 'Guardando…';
      const fila = { perfume_id: p.id, perfume_nombre: p.casa + ' ' + p.nombre, cantidad: cant, precio_unit: precio, costo_unit: c.costo || 0, vendedor: quien };
      const { data, error } = await db.from('ventas').insert(fila).select().single();
      if (error) { btn.disabled = false; btn.textContent = 'Guardar venta'; return fallo(error); }
      store.set('maison-vendedor', quien);
      S.ventas.unshift(data); cerrarHoja(); pintarRes();
      toast('Venta guardada · ' + cant + ' × ' + p.nombre);
    };
  });
}

/* ---------- Resumen ---------- */
function desde(periodo) {
  const d = inicioHoy();
  if (periodo === 'hoy') return d;
  if (periodo === 'semana') { const dia = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dia); return d; }
  if (periodo === 'mes') { d.setDate(1); return d; }
  return new Date(0);
}
$$('#res-p .chip').forEach(b => b.onclick = () => { S.periodo = b.dataset.p; $$('#res-p .chip').forEach(x => x.setAttribute('aria-pressed', x === b)); pintarRes(); });

function ranking(mapa, fmt) {
  const arr = Object.entries(mapa).sort((a, b) => b[1] - a[1]).slice(0, 5);
  if (!arr.length) return '<p class="muted small">Todavía no hay datos en este periodo.</p>';
  const max = arr[0][1];
  return '<div class="rank">' + arr.map(([k, v], i) => `<div class="rk"><span class="pos num">${i + 1}</span><div class="nm"><span>${UI.esc(k)}</span><div class="barra"><i style="width:${Math.max(6, v / max * 100)}%"></i></div></div><span class="v num">${fmt(v)}</span></div>`).join('') + '</div>';
}

function pintarRes() {
  const d0 = desde(S.periodo);
  const vs = S.ventas.filter(v => new Date(v.fecha) >= d0);
  const qs = S.preguntas.filter(q => new Date(q.fecha) >= d0);
  const nombre = id => { const p = S.perfumes.find(x => x.id === id); return p ? p.casa + ' ' + p.nombre : 'Perfume eliminado'; };
  let total = 0, unidades = 0, ganancia = 0;
  const porPerfume = {}, porVendedor = {}, porPregunta = {};
  vs.forEach(v => {
    const t = v.precio_unit * v.cantidad; total += t; unidades += v.cantidad; ganancia += (v.precio_unit - v.costo_unit) * v.cantidad;
    porPerfume[v.perfume_nombre] = (porPerfume[v.perfume_nombre] || 0) + v.cantidad;
    const pv = porVendedor[v.vendedor] || (porVendedor[v.vendedor] = { u: 0, t: 0, g: 0 });
    pv.u += v.cantidad; pv.t += t; pv.g += (v.precio_unit - v.costo_unit) * v.cantidad;
  });
  qs.forEach(q => { const k = nombre(q.perfume_id); porPregunta[k] = (porPregunta[k] || 0) + 1; });
  const wa = qs.filter(q => q.origen === 'whatsapp').length;

  $('#res').innerHTML = `
    <div class="tiles">
      <div class="tile g"><span>Vendido</span><b class="num">${UI.pesos(total)}</b></div>
      <div class="tile"><span>Unidades</span><b class="num">${unidades}</b></div>
      <div class="tile g"><span>Ganancia</span><b class="num">${secreto(UI.pesos(ganancia))}</b></div>
    </div>
    <div class="sec"><h3>Por vendedor</h3>${Object.keys(porVendedor).length ? Object.entries(porVendedor).sort((a, b) => b[1].t - a[1].t).map(([k, v]) => `<div class="seller"><span>${UI.esc(k)}</span><span class="num muted">${v.u} und · <span style="color:var(--ivory)">${UI.pesos(v.t)}</span> · ${secreto(UI.pesos(v.g), true)}</span></div>`).join('') : '<p class="muted small">Todavía no hay ventas en este periodo.</p>'}</div>
    <div class="sec"><h3>Más vendidos</h3>${ranking(porPerfume, v => v + ' und')}</div>
    <div class="sec"><h3>Más preguntados</h3>${ranking(porPregunta, v => v)}<p class="muted small" style="margin-top:8px">${qs.length} preguntas · ${wa} desde el botón Pedir del catálogo</p></div>
    <div class="sec"><h3>Ventas del periodo</h3>${vs.length ? vs.slice(0, 60).map(v => `<div class="sale"><div class="grow"><span>${v.cantidad} × ${UI.esc(v.perfume_nombre)}</span><small>${new Date(v.fecha).toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })} · ${UI.esc(v.vendedor)} · ${UI.pesos(v.precio_unit)} c/u</small></div><span class="num">${UI.pesos(v.precio_unit * v.cantidad)}</span><button class="del" data-del="${v.id}">Borrar</button></div>`).join('') : '<p class="muted small">Sin ventas en este periodo.</p>'}</div>
  `;
}
$('#res').onclick = async e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  if (!b.classList.contains('sure')) { b.classList.add('sure'); b.textContent = '¿Seguro?'; return; }
  const { error } = await db.from('ventas').delete().eq('id', b.dataset.del);
  if (error) return fallo(error);
  S.ventas = S.ventas.filter(v => v.id != b.dataset.del); pintarRes(); toast('Venta borrada');
};

iniciar();
</script>
</body>
</html>
