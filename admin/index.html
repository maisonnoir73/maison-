<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Maison Noir · Panel</title>
<meta name="theme-color" content="#0d0c0a">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('maison-tema')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="icon" href="../assets/icono.png">
<link rel="apple-touch-icon" href="../assets/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#f4f2ee; --card:#ffffff; --card2:#f8f6f1; --ink:#1b1814; --mute:#7b746a; --line:#e7e2d9;
  --gold:#a8822f; --gold-bg:#f3ead6; --bar:#e3d1a2; --on-gold:#ffffff; --ok:#2f7d4f; --ok-bg:#e3f1e8; --bad:#b5483a; --bad-bg:#f8e4e0; --warn:#a86a12;
  --shadow:0 2px 10px rgba(40,30,10,.06); --scrim:rgba(20,15,5,.45);
  --display:"Italiana",Georgia,serif; --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --nav:66px;
}
:root[data-theme="dark"]{
  --bg:#0d0c0a; --card:#1a1814; --card2:#221f1a; --ink:#f0e9db; --mute:#9a9284; --line:#2b2720;
  --gold:#d8b263; --gold-bg:#2c2516; --bar:#5e4f2f; --on-gold:#17130b; --ok:#7cc495; --ok-bg:#16291d; --bad:#e58a7a; --bad-bg:#2e1814; --warn:#e9b25a;
  --shadow:none; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;transition:background .25s,color .25s}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main{max-width:560px;margin:0 auto;padding-block:8px calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mute)}
.small{font-size:13px}

.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;height:58px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.14em;color:var(--gold);flex:1;white-space:nowrap}
.pill-btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.pill-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.pill-btn.round{width:40px;padding:0;justify-content:center}
.pill-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav)}
.nav button{appearance:none;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--gold)}

h1{font-size:26px;font-weight:500;margin:6px 0 14px}
h2{font-size:15px;font-weight:500;color:var(--mute);margin:22px 0 10px}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-size:16px;box-shadow:var(--shadow)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:500;white-space:nowrap}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.danger{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.btn.block{width:100%;padding:16px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.5}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:14px;padding:4px;border:1px solid var(--line);box-shadow:var(--shadow)}
.seg button{appearance:none;border:0;background:none;color:var(--mute);font-size:14px;padding:10px 4px;border-radius:10px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
.ph{display:flex;align-items:flex-end;justify-content:center}
.ph .frasco{height:100%;width:auto}
.ph .foto{max-height:100%;max-width:100%;object-fit:contain}

.secreto{transition:filter .2s}
body.oculto .secreto{filter:blur(7px);user-select:none}

.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:380px;margin:0 auto;padding-block:40px}
.login img{width:100%;border-radius:16px}
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:13px;font-weight:500;color:var(--mute)}
.input{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;width:100%}
textarea.input{min-height:80px;resize:vertical}
.err{color:var(--bad);font-size:14px;min-height:18px;margin:0}

.inv-head{display:flex;gap:8px;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:8px 15px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
.inv{display:flex;flex-direction:column;gap:10px}
.inv-item{display:flex;gap:12px;align-items:center;padding:12px 14px}
.inv-item .ph{width:46px;height:58px;flex:none}
.inv-item.out .ph,.inv-item.out .inv-name{opacity:.45;filter:grayscale(1)}
.inv-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;appearance:none;border:0;background:none;padding:0}
.inv-casa{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.inv-name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-prices{display:flex;gap:10px;font-size:13px;color:var(--mute);flex-wrap:wrap;align-items:center}
.inv-prices b{font-weight:600;color:var(--ink)}
.tag-out{font-size:11px;font-weight:500;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:2px 7px}
.switch{appearance:none;width:48px;height:30px;border-radius:999px;background:var(--line);position:relative;border:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (min-width:430px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{position:relative;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer}
.pcard .ph{height:104px;width:100%;margin-bottom:4px}
.pcard .cs{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.pcard .nm{font-size:14px;font-weight:500;line-height:1.15;min-height:32px;display:flex;align-items:center}
.pcard .pr{font-size:13px;color:var(--mute)}
.pcard.out .ph,.pcard.out .nm{opacity:.45;filter:grayscale(1)}
.ask{position:absolute;top:8px;right:8px;appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--mute);border-radius:999px;height:30px;min-width:30px;padding:0 8px;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.ask svg{width:15px;height:15px}
.ask.has{color:var(--gold);background:var(--gold-bg);border-color:transparent}

.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto}
.sheet-head{display:flex;gap:14px;align-items:center}
.sheet-head .ph{width:62px;height:78px;flex:none}
.sheet-title{font-size:22px;font-weight:600;line-height:1.15}
.qty{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.opt{appearance:none;border:1.5px solid var(--line);background:var(--card2);border-radius:14px;padding:13px 4px;font-size:18px;font-weight:600;text-align:center}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.opt.wide{font-size:15px;padding:13px 10px;display:flex;flex-direction:column;gap:2px;align-items:center}
.opt.wide small{font-size:13px;font-weight:400;color:var(--mute)}
.opt.txt{font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.warn{color:var(--warn);font-size:14px;margin:8px 0 0}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border-radius:16px;padding:14px 16px}
.total strong{font-size:24px;font-weight:600}
.total .g{text-align:right;color:var(--ok);font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.nrow{display:grid;grid-template-columns:1fr 128px 40px;gap:6px;margin-bottom:6px}
.nrow select{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px}
.x{appearance:none;border:1px solid var(--line);background:none;border-radius:12px;color:var(--mute)}
.photo-edit{display:flex;gap:14px;align-items:center}
.photo-edit .ph{width:80px;height:100px}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}

.resumen{padding:20px;display:flex;flex-direction:column;gap:16px;margin-top:14px}
.big span{font-size:14px;color:var(--mute)}
.big b{display:block;font-size:36px;font-weight:600;letter-spacing:-.01em}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.mini span{font-size:13px}
.mini b{font-size:21px;font-weight:600}
.mini.und{background:var(--gold-bg);color:var(--gold)}
.mini.gan{background:var(--ok-bg);color:var(--ok)}
.eye{appearance:none;border:0;background:none;color:var(--mute);font-size:14px;display:flex;gap:6px;align-items:center;padding:0;align-self:flex-start}
.chart{padding:18px 16px 14px}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:10px}
.chart-head b{font-size:16px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px}
.bar-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bar-v{font-size:11px;color:var(--mute);white-space:nowrap}
.bar-b{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--bar);min-height:3px;transition:height .4s ease}
.bar-col.hoy .bar-b{background:var(--gold)}
.bar-col.hoy .bar-v{color:var(--gold);font-weight:600}
.bar-l{font-size:12px;color:var(--mute);height:15px}
.bar-col.hoy .bar-l{color:var(--ink);font-weight:600}
.bars.many{gap:3px}
.bars.many .bar-v{display:none}
.bars.many .bar-l{font-size:10px}
.sellers{display:flex;flex-direction:column;gap:10px}
.seller{padding:14px;display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px;color:#fff}
.seller .nm{font-weight:600;font-size:16px}
.seller .sub{font-size:13px;color:var(--mute)}
.seller .money{text-align:right}
.seller .money b{display:block;font-size:17px;font-weight:600}
.seller .money small{font-size:13px;color:var(--ok);font-weight:500}
.rank{padding:6px 16px}
.rk{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk .pos{color:var(--mute);font-weight:600;font-size:14px}
.rk .nm{min-width:0;display:flex;flex-direction:column;gap:6px}
.rk .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.rk .barra{height:6px;border-radius:6px;background:var(--card2);overflow:hidden}
.rk .barra i{display:block;height:100%;background:var(--gold);border-radius:6px}
.rk .v{font-size:14px;font-weight:600}
.link{appearance:none;border:0;background:none;color:var(--mute);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:18px 0 0;display:block;margin:0 auto}
.sale{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.sale small{display:block;color:var(--mute);font-size:13px}
.del{appearance:none;border:1px solid var(--line);background:none;color:var(--mute);border-radius:10px;padding:7px 11px;font-size:13px}
.del.sure{color:var(--bad);background:var(--bad-bg);border-color:transparent}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:15px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar-b{transition:none}}
</style>
</head>
<body>

<section id="v-login" class="pad" hidden>
  <form class="login" id="f-login">
    <img src="../assets/logo.jpg" alt="Maison Noir">
    <p class="muted" style="text-align:center;margin:0">Panel del equipo</p>
    <div class="field"><label class="lbl" for="l-email">Correo</label><input class="input" id="l-email" type="email" autocomplete="username" required></div>
    <div class="field"><label class="lbl" for="l-pass">Contraseña</label><input class="input" id="l-pass" type="password" autocomplete="current-password" required></div>
    <p class="err" id="l-err"></p>
    <button class="btn gold block" id="l-btn" type="submit">Entrar</button>
  </form>
</section>

<section id="v-config" class="pad" hidden>
  <div class="login">
    <img src="../assets/logo.jpg" alt="Maison Noir">
    <p>Falta conectar Supabase. Revisa el archivo <b>config.js</b>.</p>
  </div>
</section>

<div id="v-app" hidden>
  <header class="bar pad">
    <div class="bar-in">
      <div class="brand">MAISON NOIR</div>
      <button class="pill-btn" id="b-tema"></button>
      <button class="pill-btn round" id="b-eye" aria-pressed="false" aria-label="Ocultar costos y ganancias" title="Ocultar costos y ganancias"><svg id="eye-ico" viewBox="0 0 24 24"></svg></button>
      <button class="pill-btn round" id="b-out" aria-label="Cerrar sesión" title="Cerrar sesión"><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg></button>
    </div>
  </header>

  <main class="main pad">
    <section id="t-ven">
      <h1>Vender</h1>
      <input class="search" id="ven-q" type="search" placeholder="Buscar perfume">
      <p class="muted small" style="margin:10px 2px 0">Toca el perfume que vendiste. Toca el ojito cuando alguien pregunte por uno.</p>
      <div class="grid" id="ven"></div>
    </section>

    <section id="t-res" hidden>
      <h1>Resumen</h1>
      <div class="seg" id="res-p">
        <button data-p="hoy" aria-pressed="false">Hoy</button>
        <button data-p="semana" aria-pressed="true">Semana</button>
        <button data-p="mes" aria-pressed="false">Mes</button>
      </div>
      <div id="res"></div>
    </section>

    <section id="t-inv" hidden>
      <h1>Inventario</h1>
      <div class="inv-head">
        <input class="search grow" id="inv-q" type="search" placeholder="Buscar perfume o casa">
        <button class="btn gold" id="b-new" aria-label="Agregar perfume"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nuevo</button>
      </div>
      <div class="chips" id="inv-f">
        <button class="chip" data-f="" aria-pressed="true">Todos</button>
        <button class="chip" data-f="masculino" aria-pressed="false">Hombre</button>
        <button class="chip" data-f="unisex" aria-pressed="false">Unisex</button>
        <button class="chip" data-f="femenino" aria-pressed="false">Mujer</button>
        <button class="chip" data-f="out" aria-pressed="false">Agotados</button>
      </div>
      <div class="inv" id="inv"></div>
      <button class="btn block" id="b-set" style="margin-top:18px"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Logo, WhatsApp y vendedores</button>
    </section>
  </main>

  <nav class="nav" aria-label="Secciones">
    <div class="nav-in">
      <button data-t="t-ven" aria-current="page"><svg class="i" viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Vender</button>
      <button data-t="t-res"><svg class="i" viewBox="0 0 24 24"><path d="M5 20V11M11 20V5M17 20v-6M3 20h18"/></svg>Resumen</button>
      <button data-t="t-inv"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Inventario</button>
    </div>
  </nav>
</div>

<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script src="../assets/comun.js"></script>
<script src="panel.js"></script>
</body>
</html>
